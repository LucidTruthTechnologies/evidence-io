name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to full commit SHAs, never tags: a tag can be
      # re-pointed by whoever controls the action's repo (TeamPCP).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-24

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-24
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q -rs

      - name: Windows drivers read the built volumes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tests\make_vhd.py vhd-check
          .\tests\windows_mount_check.ps1 -Dir vhd-check
