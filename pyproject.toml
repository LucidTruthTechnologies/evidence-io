[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-io"
version = "1.0.0"
description = "Read E01 images in-process and write E01 images holding FAT32 or exFAT volumes, in pure Python where libraries fall short"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lucid Truth Technologies" }]
dependencies = [
    "libewf-python==20260924",
    "pytsk3==20260715",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
